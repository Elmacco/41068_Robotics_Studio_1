# Bridges the RGB + depth camera_info topics for the rgbd_camera sensor.
#
# Not included in 41068_ignition_bringup's gazebo_bridge_parrot1.yaml, so
# kept here as its own bridge config + parameter_bridge node (same pattern
# as gazebo_bridge_parrot1_thermal.yaml) rather than editing the shared
# course package. Needed for target_projector.py to turn a detected pixel
# into a 3D point (pinhole model requires the intrinsics in CameraInfo).
#
# Ignition's rgbd_camera sensor publishes camera_info alongside each image
# topic automatically (no extra sensor config needed) — confirmed with
# `ign topic -l` while the sim was running.

- ros_topic_name: "camera/camera_info"
  gz_topic_name: "/model/parrot1/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/depth/camera_info"
  gz_topic_name: "/model/parrot1/camera/depth_image/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
