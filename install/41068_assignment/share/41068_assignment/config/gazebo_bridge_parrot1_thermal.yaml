# Bridges just the thermal camera topic added in
# urdf_parrot/parrot_thermal.urdf.xacro.
#
# Kept as its own bridge config (and its own parameter_bridge node in
# spawn_parrot.launch.py) rather than being merged into
# 41068_ignition_bringup/config/gazebo_bridge_parrot1.yaml, so that shared,
# course-provided file stays untouched and keeps working standalone for
# anyone not using the thermal camera.
#
# Unlike the RGB-D camera (whose "camera" topic gets "/image" and
# "/depth_image" suffixes appended automatically - see
# gazebo_bridge_parrot1.yaml), the thermal_camera sensor type publishes
# directly on the exact <topic> given in the sensor definition, with no
# suffix. Confirmed with `ign topic -l` while the sim was running: the only
# topic gazebo advertises for this sensor is
# /model/parrot1/thermal_camera (not .../thermal_camera/image).
- ros_topic_name: "thermal_camera/image"
  gz_topic_name: "/model/parrot1/thermal_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
